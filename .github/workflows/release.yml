name: Release

# Publishes a tag: tests, build, GitHub Release with git-cliff notes, and npm publish through
# npm trusted publishing (OIDC from this workflow file; no token secret).
# prepare-release.yml dispatches this on the tag; a manual tag push also works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Check tag against manifests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag ref"; exit 1; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for f in package.json package-lock.json .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json; do
            v=$(jq -r .version "$f")
            [ "v$v" = "$TAG" ] || { echo "::error file=$f::$f has $v, tag is $TAG"; exit 1; }
          done

  test:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: npm test
        run: |
          H=$(mktemp -d)
          HOME=$H CODEX_HOME=$H/.codex npm test
      - run: npm run build

  github-release:
    name: GitHub Release
    needs: [gate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # git-cliff here hits the same /pulls call as prepare-release.yml (see there).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0
      - name: Release notes (git-cliff)
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          body: ${{ steps.notes.outputs.content }}

  npm:
    name: npm publish
    needs: [gate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a one-time publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      # A rerun of a published version skips instead of failing.
      - run: |
          set -euo pipefail
          v=$(jq -r .version package.json)
          if npm view "ai-collab@$v" version >/dev/null 2>&1; then echo "ai-collab@$v is already on npm"; exit 0; fi
          # Verbose logs show whether the OIDC exchange ran (npm logs "oidc" lines) when a publish is refused.
          npm publish --access public --loglevel verbose
