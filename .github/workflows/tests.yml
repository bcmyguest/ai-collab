name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv tool install "prek>=0.5,<0.6"
      - run: prek run --all-files --show-diff-on-failure

  # TLC on spec/tla: host Java on the runner, else the pinned JRE image in Docker; the pinned jar is downloaded and checked.
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm run tlc

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:package && node dist/scripts/ai-collab.mjs --help
      # Postgres 17 as deploy/postgres/compose.yaml runs it, pinned by digest, so the bus, DBOS and model tests run instead of skipping.
      # max_connections: the default 100 runs out when every test file opens its pools at once.
      - name: Postgres
        run: |
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_USER=ai_collab -e POSTGRES_DB=ai_collab -e POSTGRES_PASSWORD=ci-only \
            postgres@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf -c max_connections=300
          for i in $(seq 60); do docker exec pg pg_isready -U ai_collab -d ai_collab -q && exit 0; sleep 1; done
          docker logs pg; exit 1
      # Isolated HOME: tests never read the runner's agent configs; the in-process bus (test/helpers/fake-ntfy.mjs) replaces a server.
      # A step cap below the job cap keeps the log when a test file hangs.
      - name: npm test
        timeout-minutes: 20
        run: |
          H=$(mktemp -d)
          mkdir -p $H/.config/ai-collab && printf ci-only > $H/.config/ai-collab/pg-password && chmod 600 $H/.config/ai-collab/pg-password
          HOME=$H CODEX_HOME=$H/.codex npm test -- --test-timeout=180000
      - run: npm run build
