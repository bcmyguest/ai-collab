# ntfy for AI Collab; `ai-collab setup` starts it. Config reference: https://docs.ntfy.sh/config/
name: ai-collab
services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.1
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_COLLAB_NTFY_PORT:-8794}:80"
    environment:
      NTFY_BASE_URL: ${AI_COLLAB_NTFY_BASE_URL:-http://127.0.0.1:8794}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 15M
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 1G
      NTFY_ATTACHMENT_EXPIRY_DURATION: 12h
      NTFY_BEHIND_PROXY: "true"
      NTFY_VISITOR_REQUEST_LIMIT_EXEMPT_HOSTS: 127.0.0.1,::1,172.16.0.0/12
    volumes:
      - ${AI_COLLAB_NTFY_DATA:-~/.local/share/ai-collab/ntfy}/cache:/var/cache/ntfy
      - ${AI_COLLAB_NTFY_DATA:-~/.local/share/ai-collab/ntfy}/lib:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eq '\"healthy\" *: *true'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
