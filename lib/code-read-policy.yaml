version: 1
filesystem_policy:
  include_workdir: false
  # /sandbox must be writable: the node runtime is uploaded to /sandbox/.ai-collab-code, which does not exist yet.
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies: {}
