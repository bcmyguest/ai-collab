<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calc</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, "DejaVu Sans", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, #312e81, #0f172a 70%); }
  main { width: 280px; padding: 18px; border-radius: 28px; background: #111827; box-shadow: 0 20px 60px #0008, inset 0 1px #ffffff14; }
  output { display: block; height: 84px; padding: 0 10px; text-align: right; color: #f8fafc; font: 300 52px/84px system-ui, "DejaVu Sans", sans-serif; overflow: hidden; }
  .expr { height: 22px; padding: 0 10px; text-align: right; color: #94a3b8; font-size: 16px; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  button { height: 56px; border: 0; border-radius: 18px; background: #1f2937; color: #e5e7eb; font: 500 22px system-ui, "DejaVu Sans", sans-serif; }
  button.op { background: #4f46e5; color: white; }
  button.fn { background: #374151; }
  button.wide { grid-column: span 2; }
</style>
</head>
<body>
<main>
  <div class="expr" aria-label="Expression"></div>
  <output aria-label="Display">0</output>
  <div class="keys">
    <button class="fn">C</button><button class="fn">±</button><button class="fn">%</button><button class="op">÷</button>
    <button>7</button><button>8</button><button>9</button><button class="op">×</button>
    <button>4</button><button>5</button><button>6</button><button class="op">−</button>
    <button>1</button><button>2</button><button>3</button><button class="op">+</button>
    <button class="wide">0</button><button>.</button><button class="op">=</button>
  </div>
</main>
<script>
  // A four-function calculator: digits build the entry, an operator folds it into the running value.
  const display = document.querySelector("output"), expr = document.querySelector(".expr");
  const apply = { "+": (a, b) => a + b, "−": (a, b) => a - b, "×": (a, b) => a * b, "÷": (a, b) => a / b };
  let value = null, op = null, entry = "0", fresh = true;
  const show = () => { display.textContent = entry; };
  const fold = () => { const n = Number(entry); value = value === null || !op ? n : apply[op](value, n); entry = String(+value.toFixed(10)); };
  document.querySelector(".keys").addEventListener("click", event => {
    const key = event.target.closest("button")?.textContent;
    if (!key) return;
    if (/^[0-9]$/.test(key)) { entry = fresh || entry === "0" ? key : entry + key; fresh = false; }
    else if (key === ".") { if (fresh) entry = "0"; if (!entry.includes(".")) entry += "."; fresh = false; }
    else if (key === "C") { value = null; op = null; entry = "0"; fresh = true; expr.textContent = ""; }
    else if (key === "±") entry = String(-Number(entry));
    else if (key === "%") entry = String(Number(entry) / 100);
    else if (key === "=") { if (op) { expr.textContent += " " + entry + " ="; fold(); op = null; value = null; fresh = true; } }
    else { if (!fresh || value === null) { expr.textContent = (op ? expr.textContent + " " + entry : entry) + " " + key; fold(); } else expr.textContent = expr.textContent.slice(0, -1) + key; op = key; fresh = true; }
    show();
  });
</script>
</body>
</html>
