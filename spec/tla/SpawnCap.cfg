\* Four starts against a cap of three. DeferRelease = FALSE reproduces the overshoot: a cancelled spawn that passed its claim check leaves the count before it registers.
CONSTANTS
  Starts = {s1, s2, s3, s4}
  Cap = 3
  DeferRelease = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  LiveCap
  CountCap
  SpawningTracked
