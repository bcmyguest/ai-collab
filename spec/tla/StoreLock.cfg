\* Three processes (the ceiling cascade needs three), one respawn per pid, one acquisition per incarnation.
\* OwnerWriteExclusive = FALSE reproduces the owner.json overwrite race fixed in lib/store.ts takeLock.
CONSTANTS
  Procs = {p1, p2, p3}
  MaxStart = 1
  MaxAcq = 1
  CheckStart = TRUE
  OwnerWriteExclusive = TRUE
  None = None
SPECIFICATION Spec
INVARIANTS
  TypeOK
  MutualExclusion
  HolderOwnsLock
  DeadOwnerIsStale
